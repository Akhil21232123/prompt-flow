name: android
on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android/**"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/android
    env:
      PROMPTFLOW_SUPABASEURL: ${{ vars.PROMPTFLOW_SUPABASE_URL }}
      PROMPTFLOW_SUPABASEANONKEY: ${{ vars.PROMPTFLOW_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PromptFlow-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PromptFlow.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "PromptFlow for Android (latest build)" \
              --notes "Built from main on every change. Install PromptFlow.apk, then turn on PromptFlow under Settings → Accessibility."
          gh release upload android-latest PromptFlow.apk --clobber
          git tag -f android-latest && git push -f origin android-latest
