name: site
# Publishes site/ (the download page) to GitHub Pages. Needs Pages enabled
# with source "GitHub Actions" in the repo settings.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
