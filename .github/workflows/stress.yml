name: stress test
# Runs real speech, silence and noise through the deployed backend as a
# throwaway test user, then every v2 feature (ask-back, AI targets, Hindi and
# Telugu, memory, "this", /check, limits, settings merge, delete_account).
# With repo secret PF_SERVICE (the project's secret / service_role key) it
# creates its own user; without it, it needs anonymous sign-ins switched on in
# Supabase while it runs. The user deletes itself at the end. Manual.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF || 'fhslwvrspzdcvokajvno' }}
    steps:
      - uses: actions/checkout@v5
      - name: Stress test
        env:
          PF_URL: https://${{ env.REF }}.supabase.co
          # Public by design (shipped in the apps).
          PF_ANON: ${{ vars.PF_ANON || 'sb_publishable_havZ6UNdxBtt0AtqpBZaaw_Y_lr8Lss' }}
          PF_SERVICE: ${{ secrets.PF_SERVICE }}
        run: python3 scripts/stress_test.py
