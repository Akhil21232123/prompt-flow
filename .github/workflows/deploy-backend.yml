name: deploy backend
# Deploys the Supabase edge functions (and migrations, when a DB password
# secret is set). Needs repo secret SUPABASE_ACCESS_TOKEN and repo variable
# SUPABASE_PROJECT_REF. API keys for Claude and Groq live in Supabase's own
# secrets, never here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/supabase/**", ".github/workflows/deploy-backend.yml"]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF || 'fhslwvrspzdcvokajvno' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Check setup
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::notice::Not deployed: add secret SUPABASE_ACCESS_TOKEN and variable SUPABASE_PROJECT_REF."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: 3.2.0
      - name: Migrations
        if: env.SKIP != '1' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Deploy functions
        if: env.SKIP != '1'
        run: |
          # The functions check the user's token themselves (via /auth/v1/user),
          # which works with both legacy and new JWT signing keys.
          supabase functions deploy health dictate rewrite learn check usage delete_account feedback --project-ref "$REF" --no-verify-jwt --use-api --yes
      - name: Health check
        if: env.SKIP != '1'
        run: |
          curl -fsS "https://$REF.supabase.co/functions/v1/health" | tee health.json
          # The v2 tables come from a migration run by hand when there's no
          # DB password; say so instead of failing the deploy.
          if ! grep -q '"memories":true' health.json; then
            echo "::warning::v2 tables not found. Run backend/supabase/migrations/20261123000000_v2.sql in the Supabase SQL editor."
          fi
