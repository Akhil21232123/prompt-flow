name: mac
# Builds the Mac app (Apple silicon) and publishes it to the mac-latest
# release as PromptFlow.dmg. First open needs
# System Settings → Privacy & Security → Open Anyway.
#
# Signing: ad-hoc by default, which gives every build a new identity, so
# macOS drops Accessibility/Input Monitoring after each update. With the
# repository secrets MAC_SIGN_P12 (a base64 .p12 with a code-signing
# certificate; a self-signed one is enough) and MAC_SIGN_PASSWORD, every
# build is signed with that one identity and the grants survive updates.
on:
  workflow_dispatch:
  push:
    branches: [main, "agent/**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mac.yml"

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: mac-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: mac-cargo-
      - name: Voice-activity model
        run: |
          mkdir -p src-tauri/resources/models
          curl -fsSL -o src-tauri/resources/models/silero-vad-v6.2-F32.gguf \
            https://huggingface.co/handy-computer/silero-vad-v6.2-gguf/resolve/main/silero-vad-v6.2-F32.gguf
      - run: bun install --frozen-lockfile
      - name: Stable signing identity (optional)
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then
            echo "No MAC_SIGN_P12 secret: signing ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/promptflow-sign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/promptflow-sign.p12"
          printf '%s' "$MAC_SIGN_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Recorded at once, so the cleanup step runs even if a later one fails.
          echo "PROMPTFLOW_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MAC_SIGN_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          # Untrusted (self-signed) identities are listed too, so no -v.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
            | awk '/^ *1\)/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MAC_SIGN_P12 has no code-signing identity"
            exit 1
          fi
          echo "Signing with identity $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build
        env:
          # Compared with the release's build number by "Update available".
          PROMPTFLOW_BUILD: ${{ github.run_number }}
        run: bun run tauri build --bundles app,dmg
      - name: Keep the dmg from branch builds
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PromptFlow-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
      - name: Remove the signing keychain
        if: always() && env.PROMPTFLOW_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$PROMPTFLOW_SIGN_KEYCHAIN" || true
      - name: Publish to the mac-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" PromptFlow.dmg
          gh release view mac-latest >/dev/null 2>&1 || \
            gh release create mac-latest --prerelease --title "PromptFlow for Mac (latest build)" \
              --notes "Apple silicon. Open PromptFlow.dmg, drag PromptFlow to Applications, then on first launch: System Settings → Privacy & Security → Open Anyway."
          gh release upload mac-latest PromptFlow.dmg --clobber
          # The app reads this to offer "Update available".
          gh release edit mac-latest --notes "Apple silicon. Open PromptFlow.dmg, drag PromptFlow to Applications, then on first launch: System Settings → Privacy & Security → Open Anyway.

          build:${{ github.run_number }}"
