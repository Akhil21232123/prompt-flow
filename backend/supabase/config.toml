# Supabase project config for PromptFlow's backend.
# Deploy: see backend/README.md.
project_id = "promptflow"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "promptflow://auth"
additional_redirect_urls = ["promptflow://auth", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Sign-in emails carry both a link and a 6-digit code (templates below).
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.external.apple]
# Turn on in the Supabase dashboard once the Apple Services ID exists.
enabled = false
client_id = ""
secret = ""

[auth.email.template.magic_link]
subject = "Your PromptFlow sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your PromptFlow account"
content_path = "./supabase/templates/confirmation.html"

# Every function checks the caller's token itself (via /auth/v1/user), which
# works with both legacy JWTs and the new publishable/secret keys, so the
# gateway's JWT check is off (deployed with --no-verify-jwt).
[functions.dictate]
verify_jwt = false

[functions.rewrite]
verify_jwt = false

[functions.learn]
verify_jwt = false

[functions.check]
verify_jwt = false

[functions.usage]
verify_jwt = false

[functions.delete_account]
verify_jwt = false

[functions.feedback]
verify_jwt = false

[functions.health]
verify_jwt = false
