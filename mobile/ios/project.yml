name: PromptFlow
options:
  bundleIdPrefix: com.akhil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # set your Apple team ID in Xcode (Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  PromptFlow:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: PromptFlowKeyboard
        embed: true
    entitlements:
      path: App/PromptFlow.entitlements
      properties:
        com.apple.security.application-groups: [group.com.akhil.promptflow]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PromptFlow
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: PromptFlow listens only while a Flow Session is on, to turn what you say into text.
        CFBundleURLTypes:
          - CFBundleURLName: com.akhil.promptflow
            CFBundleURLSchemes: [promptflow]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        PromptFlowSupabaseURL: $(PROMPTFLOW_SUPABASE_URL)
        PromptFlowSupabaseAnonKey: $(PROMPTFLOW_SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhil.promptflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  PromptFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    entitlements:
      path: Keyboard/PromptFlowKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.akhil.promptflow]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: PromptFlow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
        PromptFlowSupabaseURL: $(PROMPTFLOW_SUPABASE_URL)
        PromptFlowSupabaseAnonKey: $(PROMPTFLOW_SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhil.promptflow.keyboard
        TARGETED_DEVICE_FAMILY: "1"
  PromptFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhil.promptflow.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PromptFlow:
    build:
      targets:
        PromptFlow: all
        PromptFlowKeyboard: all
    test:
      targets: [PromptFlowTests]
